services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tengames
      POSTGRES_USER: tengames
      POSTGRES_PASSWORD: tengames
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tengames -d tengames"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
