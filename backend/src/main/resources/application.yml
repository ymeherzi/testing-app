spring:
  application:
    name: predictor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/predictor}
    username: ${DB_USER:predictor}
    password: ${DB_PASSWORD:predictor}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    # surface the reason on 4xx ("That code is not right") instead of a bare status
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:}
    # testing aid only — prints login codes to the log. Must stay off in production.
    log-codes: ${MAIL_LOG_CODES:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 7d
  fixtures:
    provider: ${APP_FIXTURES_PROVIDER:seed}
  jobs:
    enabled: ${APP_JOBS_ENABLED:false}
  footballdata:
    base-url: https://api.football-data.org/v4
    api-key: ${FOOTBALL_DATA_API_KEY:}
