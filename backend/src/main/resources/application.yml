spring:
  application:
    name: tengames
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tengames}
    username: ${DB_USER:tengames}
    password: ${DB_PASSWORD:tengames}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    # surface the reason on 4xx ("That code is not right") instead of a bare status
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  mail:
    # any SMTP relay (Brevo, Mailjet, Gmail): reaches any recipient once the
    # provider has verified the MAIL_FROM address. Takes precedence over Resend.
    smtp:
      host: ${MAIL_SMTP_HOST:}
      port: ${MAIL_SMTP_PORT:587}
      username: ${MAIL_SMTP_USERNAME:}
      password: ${MAIL_SMTP_PASSWORD:}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:}
    # testing aid only — prints login codes to the log. Must stay off in production.
    log-codes: ${MAIL_LOG_CODES:false}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:}
    ttl: 7d
  fixtures:
    provider: ${APP_FIXTURES_PROVIDER:seed}
  jobs:
    enabled: ${APP_JOBS_ENABLED:false}
  push:
    # VAPID identity: generate a P-256 pair, keep the private one secret
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:no-reply@tengames.app}
  footballdata:
    base-url: https://api.football-data.org/v4
    api-key: ${FOOTBALL_DATA_API_KEY:}
